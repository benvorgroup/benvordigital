<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="color-scheme" content="light">
  <title>Benvor Sites Builder | Benvor Digital</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/admin/sites-builder.css">
</head>
<body>
  <div id="bv-app" class="bv-app" aria-busy="true">
    <header class="bv-topbar">
      <div class="bv-brand-zone">
        <a class="bv-brand" href="/" target="_blank" rel="noopener" aria-label="Open Benvor Digital website">
          <img src="/assets/branding/benvor-horizontal-dark.png" alt="Benvor Digital">
        </a>
        <div class="bv-doc-title">
          <input id="bv-page-title" type="text" value="Loading…" aria-label="Page title">
          <div class="bv-save-line"><span id="bv-save-dot"></span><span id="bv-save-status">Loading page…</span></div>
        </div>
      </div>

      <div class="bv-toolbar" aria-label="Builder toolbar">
        <button class="bv-icon-btn" id="bv-undo" title="Undo" aria-label="Undo" disabled>↶</button>
        <button class="bv-icon-btn" id="bv-redo" title="Redo" aria-label="Redo" disabled>↷</button>
        <span class="bv-toolbar-sep"></span>
        <div class="bv-device-switcher" aria-label="Preview device">
          <button data-device="desktop" class="active" title="Desktop">▱</button>
          <button data-device="laptop" title="Laptop">▭</button>
          <button data-device="tablet" title="Tablet">▯</button>
          <button data-device="mobile" title="Mobile">▯</button>
        </div>
        <button class="bv-text-btn" id="bv-preview">Preview</button>
        <button class="bv-publish-btn" id="bv-publish">Publish</button>
        <button class="bv-avatar-btn" id="bv-account" title="GitHub account" aria-label="GitHub account">G</button>
        <button class="bv-icon-btn" id="bv-more" title="More" aria-label="More options">⋮</button>
      </div>
    </header>

    <main class="bv-workspace">
      <section class="bv-canvas-area" aria-label="Page canvas">
        <div id="bv-canvas-shell" class="bv-canvas-shell desktop">
          <iframe id="bv-preview-frame" title="Benvor page preview"></iframe>
        </div>
        <button id="bv-add-section-floating" class="bv-add-section-floating">＋ Add section</button>
      </section>

      <aside class="bv-sidepanel" id="bv-sidepanel">
        <div class="bv-side-tabs" id="bv-main-tabs">
          <button data-panel="insert" class="active">INSERT</button>
          <button data-panel="pages">PAGES</button>
          <button data-panel="themes">THEMES</button>
        </div>
        <div id="bv-side-content" class="bv-side-content"></div>
      </aside>
    </main>
  </div>

  <div id="bv-toast" class="bv-toast" role="status" aria-live="polite"></div>
  <div id="bv-modal-root"></div>
  <button id="bv-exit-preview" class="bv-exit-preview" hidden>Exit preview</button>

  <script defer src="/admin/sites-builder.js"></script>
</body>
</html>
