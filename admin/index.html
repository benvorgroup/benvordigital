<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="color-scheme" content="light">
  <title>Benvor Sites Builder</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/admin/sites-builder.css">
</head>
<body>
  <div id="bv-app" class="bv-app" aria-busy="true">
    <header class="bv-topbar">
      <div class="bv-site-identity">
        <button id="bv-pages-toggle" class="bv-icon-button bv-mobile-only" type="button" title="Pages" aria-label="Toggle pages panel">
          <span class="bv-icon" data-icon="pages"></span>
        </button>
        <a class="bv-site-icon" href="/" target="_blank" rel="noopener" aria-label="Open Benvor Digital website">
          <img src="/favicon.ico" alt="">
        </a>
        <div class="bv-site-title-wrap">
          <input id="bv-site-title" class="bv-site-title" type="text" value="Benvor Digital" aria-label="Site title">
          <div class="bv-current-page-line">
            <span id="bv-current-page-name">Home</span>
            <span class="bv-dot-separator">•</span>
            <span id="bv-save-status" class="bv-save-status" data-tone="working">Loading…</span>
          </div>
        </div>
      </div>

      <nav class="bv-top-actions" aria-label="Site builder actions">
        <button id="bv-undo" class="bv-icon-button" type="button" title="Undo" aria-label="Undo" disabled><span class="bv-icon" data-icon="undo"></span></button>
        <button id="bv-redo" class="bv-icon-button" type="button" title="Redo" aria-label="Redo" disabled><span class="bv-icon" data-icon="redo"></span></button>
        <span class="bv-toolbar-divider" aria-hidden="true"></span>
        <button id="bv-preview" class="bv-icon-button" type="button" title="Preview" aria-label="Preview"><span class="bv-icon" data-icon="preview"></span></button>
        <button id="bv-share" class="bv-icon-button" type="button" title="Share" aria-label="Share"><span class="bv-icon" data-icon="share"></span></button>
        <button id="bv-settings" class="bv-icon-button" type="button" title="Settings" aria-label="Site settings"><span class="bv-icon" data-icon="settings"></span></button>
        <div id="bv-published-state" class="bv-published-state" title="Publish status">Draft</div>
        <button id="bv-publish" class="bv-publish-button" type="button">Publish</button>
        <button id="bv-more" class="bv-icon-button" type="button" title="More" aria-label="More options"><span class="bv-icon" data-icon="more"></span></button>
        <button id="bv-account" class="bv-avatar-button" type="button" title="GitHub account" aria-label="GitHub account">G</button>
      </nav>
    </header>

    <main class="bv-workspace">
      <aside id="bv-pages-panel" class="bv-pages-panel" aria-label="Pages panel">
        <div class="bv-panel-heading">
          <div>
            <h2>Pages</h2>
            <p>Manage your site pages</p>
          </div>
          <button id="bv-pages-close" class="bv-icon-button bv-mobile-only" type="button" title="Close pages"><span class="bv-icon" data-icon="close"></span></button>
        </div>
        <button id="bv-new-page" class="bv-new-page-button" type="button"><span class="bv-icon" data-icon="plus"></span> New page</button>
        <div id="bv-page-tree" class="bv-page-tree" role="tree"></div>
      </aside>

      <section class="bv-editor-area" aria-label="Editor workspace">
        <div id="bv-canvas-scroll" class="bv-canvas-scroll">
          <div id="bv-canvas-shell" class="bv-canvas-shell desktop">
            <iframe id="bv-preview-frame" title="Benvor Digital page preview"></iframe>
          </div>
        </div>
        <button id="bv-add-section-floating" class="bv-add-section-floating" type="button"><span class="bv-icon" data-icon="plus"></span> Add section</button>
      </section>

      <aside id="bv-sidepanel" class="bv-sidepanel" aria-label="Insert and theme panel">
        <div id="bv-main-tabs" class="bv-side-tabs" role="tablist">
          <button type="button" data-panel="insert" class="active" role="tab" aria-selected="true">Insert</button>
          <button type="button" data-panel="pages" role="tab" aria-selected="false">Pages</button>
          <button type="button" data-panel="themes" role="tab" aria-selected="false">Themes</button>
        </div>
        <div id="bv-side-content" class="bv-side-content"></div>
      </aside>
    </main>
  </div>

  <div id="bv-settings-backdrop" class="bv-drawer-backdrop" hidden></div>
  <aside id="bv-settings-drawer" class="bv-settings-drawer" aria-label="Site settings" aria-hidden="true">
    <div class="bv-settings-header">
      <div>
        <span class="bv-kicker">SITE SETTINGS</span>
        <h2>Settings</h2>
      </div>
      <button id="bv-settings-close" class="bv-icon-button" type="button" title="Close settings"><span class="bv-icon" data-icon="close"></span></button>
    </div>
    <div id="bv-settings-tabs" class="bv-settings-tabs" role="tablist">
      <button type="button" data-settings-tab="navigation" class="active">Navigation</button>
      <button type="button" data-settings-tab="brand">Brand Images</button>
      <button type="button" data-settings-tab="viewer">Viewer Tools</button>
      <button type="button" data-settings-tab="options">Site Options</button>
    </div>
    <div id="bv-settings-content" class="bv-settings-content"></div>
  </aside>

  <div id="bv-preview-overlay" class="bv-preview-overlay" hidden>
    <div class="bv-preview-toolbar">
      <div class="bv-device-switcher" role="group" aria-label="Preview device">
        <button type="button" data-device="desktop" class="active" title="Desktop"><span class="bv-icon" data-icon="desktop"></span></button>
        <button type="button" data-device="tablet" title="Tablet"><span class="bv-icon" data-icon="tablet"></span></button>
        <button type="button" data-device="mobile" title="Mobile"><span class="bv-icon" data-icon="mobile"></span></button>
      </div>
      <span id="bv-preview-page-label">Home</span>
      <button id="bv-exit-preview" class="bv-preview-close" type="button"><span class="bv-icon" data-icon="close"></span> Exit preview</button>
    </div>
    <div class="bv-preview-stage">
      <div id="bv-preview-shell" class="bv-preview-shell desktop"></div>
    </div>
  </div>

  <div id="bv-modal-root"></div>
  <div id="bv-menu-root"></div>
  <div id="bv-toast" class="bv-toast" role="status" aria-live="polite"></div>

  <script defer src="/admin/sites-builder.js"></script>
</body>
</html>
