backend:
  name: github
  repo: benvorgroup/benvordigital
  branch: main
  base_url: https://benvor-cms-auth.benvorgroup.workers.dev/
  auth_endpoint: auth

media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

collections:
  - name: "pages"
    label: "Pages"
    label_singular: "Page"
    folder: "content/pages"
    create: true
    delete: true
    extension: "json"
    format: "json"
    slug: "{{fields.slug}}"
    identifier_field: "title"
    summary: "{{title}} — #{{slug}}"
    fields:
      - {label: "Page Name", name: "title", widget: "string"}
      - {label: "Slug", name: "slug", widget: "string", hint: "Use lowercase letters, numbers and hyphens only."}
      - {label: "Navigation Label", name: "navigation_label", widget: "string", required: false}
      - {label: "Published", name: "published", widget: "boolean", default: true}
      - label: "Page SEO"
        name: "seo"
        widget: "object"
        fields:
          - {label: "SEO Title", name: "title", widget: "string", required: false}
          - {label: "Meta Description", name: "description", widget: "text", required: false}
          - {label: "Keywords", name: "keywords", widget: "string", required: false}
          - {label: "Canonical URL", name: "canonical_url", widget: "string", required: false}
          - {label: "Open Graph Title", name: "og_title", widget: "string", required: false}
          - {label: "Open Graph Description", name: "og_description", widget: "text", required: false}
          - {label: "Open Graph Image Upload", name: "og_image", widget: "image", required: false}
          - {label: "Open Graph Image External URL", name: "og_image_external", widget: "string", required: false}
          - {label: "Allow Indexing", name: "robots_index", widget: "boolean", default: true}
          - {label: "Allow Link Following", name: "robots_follow", widget: "boolean", default: true}
      - label: "Page Sections"
        name: "sections"
        widget: "list"
        collapsed: true
        summary: "{{fields.type}} — {{fields.heading}}"

        types:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Visible", name: "visible", widget: "boolean", default: true}
              - {label: "Section ID", name: "section_id", widget: "string", required: false}
              - {label: "Background Color", name: "background_color", widget: "color", required: false}
              - {label: "Text Color", name: "text_color", widget: "color", required: false}
              - {label: "Content Width", name: "content_width", widget: "select", options: ["narrow", "wide", "full"], default: "wide"}
              - {label: "Alignment", name: "alignment", widget: "select", options: ["left", "center", "right"], default: "left"}
              - {label: "Vertical Spacing", name: "padding", widget: "select", options: ["compact", "normal", "spacious"], default: "normal"}
              - {label: "Show on Mobile", name: "mobile_visible", widget: "boolean", default: true}
              - {label: "Show on Desktop", name: "desktop_visible", widget: "boolean", default: true}
              - {label: "Eyebrow", name: "eyebrow", widget: "string", required: false}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Text", name: "text", widget: "text", required: false}

              - {label: "Hero Image Upload / Media Library", name: "image", widget: "image", required: false}
              - {label: "Hero Image External URL", name: "image_external", widget: "string", required: false}
              - {label: "Hero Image Alt Text", name: "image_alt", widget: "string", required: false}
              - {label: "Image Position", name: "image_position", widget: "select", options: ["left","right"], default: "right"}
              - label: "Primary Button"
                name: "primary_button"
                widget: "object"
                fields:
                  - {label: "Label", name: "label", widget: "string", required: false}
                  - {label: "URL", name: "url", widget: "string", required: false}
                  - {label: "Open in New Tab", name: "new_tab", widget: "boolean", default: false}
              - label: "Secondary Button"
                name: "secondary_button"
                widget: "object"
                fields:
                  - {label: "Label", name: "label", widget: "string", required: false}
                  - {label: "URL", name: "url", widget: "string", required: false}
                  - {label: "Open in New Tab", name: "new_tab", widget: "boolean", default: false}

          - label: "Page Hero"
            name: "page_hero"
            widget: "object"
            fields:
              - {label: "Visible", name: "visible", widget: "boolean", default: true}
              - {label: "Section ID", name: "section_id", widget: "string", required: false}
              - {label: "Background Color", name: "background_color", widget: "color", required: false}
              - {label: "Text Color", name: "text_color", widget: "color", required: false}
              - {label: "Content Width", name: "content_width", widget: "select", options: ["narrow", "wide", "full"], default: "wide"}
              - {label: "Alignment", name: "alignment", widget: "select", options: ["left", "center", "right"], default: "left"}
              - {label: "Vertical Spacing", name: "padding", widget: "select", options: ["compact", "normal", "spacious"], default: "normal"}
              - {label: "Show on Mobile", name: "mobile_visible", widget: "boolean", default: true}
              - {label: "Show on Desktop", name: "desktop_visible", widget: "boolean", default: true}
              - {label: "Eyebrow", name: "eyebrow", widget: "string", required: false}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Text", name: "text", widget: "text", required: false}

          - label: "Text"
            name: "text"
            widget: "object"
            fields:
              - {label: "Visible", name: "visible", widget: "boolean", default: true}
              - {label: "Section ID", name: "section_id", widget: "string", required: false}
              - {label: "Background Color", name: "background_color", widget: "color", required: false}
              - {label: "Text Color", name: "text_color", widget: "color", required: false}
              - {label: "Content Width", name: "content_width", widget: "select", options: ["narrow", "wide", "full"], default: "wide"}
              - {label: "Alignment", name: "alignment", widget: "select", options: ["left", "center", "right"], default: "left"}
              - {label: "Vertical Spacing", name: "padding", widget: "select", options: ["compact", "normal", "spacious"], default: "normal"}
              - {label: "Show on Mobile", name: "mobile_visible", widget: "boolean", default: true}
              - {label: "Show on Desktop", name: "desktop_visible", widget: "boolean", default: true}
              - {label: "Eyebrow", name: "eyebrow", widget: "string", required: false}
              - {label: "Heading", name: "heading", widget: "string", required: false}
              - {label: "Text", name: "text", widget: "text"}

          - label: "Rich Text"
            name: "rich_text"
            widget: "object"
            fields:
              - {label: "Visible", name: "visible", widget: "boolean", default: true}
              - {label: "Section ID", name: "section_id", widget: "string", required: false}
              - {label: "Background Color", name: "background_color", widget: "color", required: false}
              - {label: "Text Color", name: "text_color", widget: "color", required: false}
              - {label: "Content Width", name: "content_width", widget: "select", options: ["narrow", "wide", "full"], default: "wide"}
              - {label: "Alignment", name: "alignment", widget: "select", options: ["left", "center", "right"], default: "left"}
              - {label: "Vertical Spacing", name: "padding", widget: "select", options: ["compact", "normal", "spacious"], default: "normal"}
              - {label: "Show on Mobile", name: "mobile_visible", widget: "boolean", default: true}
              - {label: "Show on Desktop", name: "desktop_visible", widget: "boolean", default: true}
              - {label: "Eyebrow", name: "eyebrow", widget: "string", required: false}
              - {label: "Heading", name: "heading", widget: "string", required: false}
              - {label: "Body", name: "body", widget: "markdown"}

          - label: "Image"
            name: "image"
            widget: "object"
            fields:
              - {label: "Visible", name: "visible", widget: "boolean", default: true}
              - {label: "Section ID", name: "section_id", widget: "string", required: false}
              - {label: "Background Color", name: "background_color", widget: "color", required: false}
              - {label: "Text Color", name: "text_color", widget: "color", required: false}
              - {label: "Content Width", name: "content_width", widget: "select", options: ["narrow", "wide", "full"], default: "wide"}
              - {label: "Alignment", name: "alignment", widget: "select", options: ["left", "center", "right"], default: "left"}
              - {label: "Vertical Spacing", name: "padding", widget: "select", options: ["compact", "normal", "spacious"], default: "normal"}
              - {label: "Show on Mobile", name: "mobile_visible", widget: "boolean", default: true}
              - {label: "Show on Desktop", name: "desktop_visible", widget: "boolean", default: true}
              - {label: "Eyebrow", name: "eyebrow", widget: "string", required: false}
              - {label: "Heading", name: "heading", widget: "string", required: false}

              - {label: "Image Upload / Media Library", name: "image", widget: "image", required: false}
              - {label: "Image External URL", name: "image_external", widget: "string", required: false}
              - {label: "Image Alt Text", name: "image_alt", widget: "string", required: false}
              - {label: "Caption", name: "image_caption", widget: "string", required: false}
              - {label: "Image Link", name: "image_link", widget: "string", required: false}

          - label: "Image + Text"
            name: "image_text"
            widget: "object"
            fields:
              - {label: "Visible", name: "visible", widget: "boolean", default: true}
              - {label: "Section ID", name: "section_id", widget: "string", required: false}
              - {label: "Background Color", name: "background_color", widget: "color", required: false}
              - {label: "Text Color", name: "text_color", widget: "color", required: false}
              - {label: "Content Width", name: "content_width", widget: "select", options: ["narrow", "wide", "full"], default: "wide"}
              - {label: "Alignment", name: "alignment", widget: "select", options: ["left", "center", "right"], default: "left"}
              - {label: "Vertical Spacing", name: "padding", widget: "select", options: ["compact", "normal", "spacious"], default: "normal"}
              - {label: "Show on Mobile", name: "mobile_visible", widget: "boolean", default: true}
              - {label: "Show on Desktop", name: "desktop_visible", widget: "boolean", default: true}
              - {label: "Eyebrow", name: "eyebrow", widget: "string", required: false}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Text", name: "text", widget: "text", required: false}

              - {label: "Image Upload / Media Library", name: "image", widget: "image", required: false}
              - {label: "Image External URL", name: "image_external", widget: "string", required: false}
              - {label: "Image Alt Text", name: "image_alt", widget: "string", required: false}
              - {label: "Image Position", name: "image_position", widget: "select", options: ["left","right"], default: "left"}
              - label: "Button"
