backend:
  name: github
  repo: benvorgroup/benvordigital
  branch: main
  base_url: https://benvor-cms-auth.benvorgroup.workers.dev/
  auth_endpoint: auth
publish_mode: editorial_workflow
site_url: https://benvordigital.com
display_url: https://benvordigital.com
media_folder: assets/images/uploads
public_folder: /assets/images/uploads
collections:
- name: pages
  label: Pages / Visual Page Builder
  label_singular: Page
  folder: content/pages
  create: true
  delete: true
  extension: json
  format: json
  slug: '{{fields.slug}}'
  identifier_field: title
  summary: '{{title}}  /  {{slug}}'
  preview_path: page/?slug={{slug}}
  fields:
  - label: Page Title
    name: title
    widget: string
  - label: Slug
    name: slug
    widget: string
    hint: 'Existing main pages: home, about, services, portfolio, contact. New pages can be viewed at /page/?slug=YOUR-SLUG'
  - label: Published
    name: published
    widget: boolean
    default: true
  - label: Show Header
    name: show_header
    widget: boolean
    default: true
  - label: Show Footer
    name: show_footer
    widget: boolean
    default: true
  - label: SEO
    name: seo
    widget: object
    fields:
    - label: SEO Title
      name: title
      widget: string
      required: false
    - label: Meta Description
      name: description
      widget: text
      required: false
    - label: Canonical URL
      name: canonical_url
      widget: string
      required: false
    - label: Open Graph Title
      name: og_title
      widget: string
      required: false
    - label: Open Graph Description
      name: og_description
      widget: text
      required: false
    - label: Open Graph Image
      name: og_image
      widget: image
      required: false
    - label: Noindex / Hide from Search
      name: noindex
      widget: boolean
      default: false
    - label: Schema Type
      name: schema_type
      widget: select
      options:
      - WebPage
      - AboutPage
      - ContactPage
      - CollectionPage
      default: WebPage
  - label: Page Sections
    name: sections
    widget: list
    collapsed: true
    summary: '{{fields.type}} — {{fields.heading}}'
    types:
    - label: Hero + Analytics Dashboard
      name: hero_dashboard
      widget: object
      fields:
      - &id001
        label: Enabled
        name: enabled
        widget: boolean
        default: true
      - label: Eyebrow
        name: eyebrow
        widget: string
        required: false
      - label: Heading
        name: heading
        widget: string
      - label: Blue Highlight Text
        name: highlight
        widget: string
        required: false
      - label: Supporting Text
        name: text
        widget: text
      - label: Primary Button
        name: primary_button
        widget: object
        fields:
        - label: Label
          name: label
          widget: string
        - label: URL
          name: url
          widget: string
      - label: Secondary Button
        name: secondary_button
        widget: object
        fields:
        - label: Label
          name: label
          widget: string
        - label: URL
          name: url
          widget: string
      - label: Hero Stats
        name: stats
        widget: list
        fields:
        - label: Icon
          name: icon
          widget: select
          options:
          - trend
          - users
          - trophy
          - target
          - database
          - shield
          - globe
          - chart
          - spark
        - label: Value
          name: value
          widget: string
        - label: Label
          name: label
          widget: string
      - label: Analytics Dashboard
        name: dashboard
        widget: object
        fields:
        - label: Panel Label
          name: label
          widget: string
        - label: Period
          name: period
          widget: string
        - label: Metric Label
          name: metric_label
          widget: string
        - label: Metric Value
          name: metric_value
          widget: string
        - label: Metric Change
          name: metric_change
          widget: string
        - label: Chart Values
          name: chart_values
          widget: list
          field:
            label: Value
            name: value
            widget: number
        - label: Conversions Panel Label
          name: conversions_label
          widget: string
          default: Conversions
        - label: Conversions
          name: conversions
          widget: string
        - label: Conversion Change
          name: conversion_change
          widget: string
        - label: Channels Panel Label
          name: channels_label
          widget: string
          default: Top Channels
        - label: Top Channels
          name: channels
          widget: list
          fields:
          - label: Channel
            name: label
            widget: string
          - label: Percentage
            name: value
            widget: number
            min: 0
            max: 100
      - &id002
        label: Container Width
        name: container_width
        widget: select
        options:
        - label: Narrow
          value: narrow
        - label: Default
          value: default
        - label: Wide
          value: wide
        - label: Full Width
          value: full
        default: default
      - &id003
        label: Top Spacing
        name: padding_top
        widget: select
        options:
        - none
        - small
        - default
        - large
        default: default
      - &id004
        label: Bottom Spacing
        name: padding_bottom
        widget: select
        options:
        - none
        - small
        - default
        - large
        default: default
      - &id005
        label: Minimum Section Height
        name: min_height
        widget: select
        options:
        - label: Auto
          value: auto
        - label: Compact 320px
          value: compact
        - label: Medium 480px
          value: medium
        - label: Tall 640px
          value: tall
        - label: Full Screen
          value: screen
        default: auto
      - &id006
        label: Vertical Alignment
        name: vertical_align
        widget: select
        options:
        - start
        - center
        - end
        default: start
      - &id007
        label: Section Background
        name: background
        widget: select
        options:
        - label: Default
          value: default
        - label: White
          value: white
        - label: Light Grey
          value: light_grey
        - label: Navy
          value: navy
        - label: Blue
          value: blue
        default: default
      - &id008
        label: Fix / Sticky Section
        name: sticky
        widget: boolean
        default: false
      - &id009
        label: Hide on Mobile
        name: hide_mobile
        widget: boolean
        default: false
      - &id010
        label: Hide on Tablet / iPad
        name: hide_tablet
        widget: boolean
        default: false
