          value: default
        - label: White
          value: white
        - label: Light Grey
          value: light_grey
        - label: Navy
          value: navy
        - label: Blue
          value: blue
        default: default
      - &id006
        label: Fix / Sticky Section
        name: sticky
        widget: boolean
        default: false
      - &id007
        label: Hide on Mobile
        name: hide_mobile
        widget: boolean
        default: false
