backend:
  name: github
  repo: benvorgroup/benvordigital
  branch: main
  base_url: https://benvor-cms-auth.benvorgroup.workers.dev/
  auth_endpoint: auth

media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - label: "Homepage"
        name: "homepage"
        file: "content/homepage.json"
        format: "json"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Eyebrow", name: "eyebrow", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Text", name: "text", widget: "text"}
              - {label: "Primary Button Text", name: "primary_text", widget: "string"}
              - {label: "Primary Button Link", name: "primary_link", widget: "string"}
              - {label: "Secondary Button Text", name: "secondary_text", widget: "string"}
              - {label: "Secondary Button Link", name: "secondary_link", widget: "string"}
              - label: "Stats"
                name: "stats"
                widget: "list"
                fields:
                  - {label: "Value", name: "value", widget: "string"}
                  - {label: "Label", name: "label", widget: "string"}
          - label: "Trust Strip"
            name: "trust"
            widget: "object"
            fields:
              - {label: "Label", name: "label", widget: "string"}
              - {label: "Items", name: "items", widget: "list", field: {label: "Item", name: "item", widget: "string"}}
          - label: "Benefits"
            name: "benefits"
            widget: "object"
            fields:
              - {label: "Eyebrow", name: "eyebrow", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Text", name: "text", widget: "text"}
              - label: "Benefit Cards"
                name: "items"
                widget: "list"
                fields:
                  - {label: "Number / Label", name: "number", widget: "string"}
                  - {label: "Title", name: "title", widget: "string"}
                  - {label: "Text", name: "text", widget: "text"}
          - label: "Services Heading"
            name: "services"
            widget: "object"
            fields:
              - {label: "Eyebrow", name: "eyebrow", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
          - label: "Testimonials Heading"
            name: "testimonials"
            widget: "object"
            fields:
              - {label: "Eyebrow", name: "eyebrow", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
          - label: "About Preview"
            name: "about_preview"
            widget: "object"
            fields:
              - {label: "Eyebrow", name: "eyebrow", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Text", name: "text", widget: "text"}
              - {label: "Button Text", name: "button_text", widget: "string"}
              - {label: "Button Link", name: "button_link", widget: "string"}
          - label: "Final CTA"
            name: "final_cta"
            widget: "object"
            fields:
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Text", name: "text", widget: "text"}
              - {label: "Primary Button Text", name: "primary_text", widget: "string"}
              - {label: "Primary Button Link", name: "primary_link", widget: "string"}
              - {label: "Secondary Button Text", name: "secondary_text", widget: "string"}
              - {label: "Secondary Button Link", name: "secondary_link", widget: "string"}

          - label: "Custom Sections"
            name: "custom_sections"
            widget: "list"
            required: false
            types:
              - label: "Text Section"
                name: "text"
                widget: "object"
                fields:
                  - {label: "Visible", name: "visible", widget: "boolean", default: true}
                  - {label: "Eyebrow", name: "eyebrow", widget: "string", required: false}
                  - {label: "Heading", name: "heading", widget: "string", required: false}
                  - {label: "Text", name: "text", widget: "text", required: false}
                  - {label: "Button Text", name: "button_text", widget: "string", required: false}
                  - {label: "Button Link", name: "button_link", widget: "string", required: false}
                  - {label: "Background Color", name: "background_color", widget: "color", required: false}
              - label: "Image + Text"
                name: "image_text"
                widget: "object"
                fields:
                  - {label: "Visible", name: "visible", widget: "boolean", default: true}
                  - {label: "Eyebrow", name: "eyebrow", widget: "string", required: false}
                  - {label: "Heading", name: "heading", widget: "string"}
                  - {label: "Text", name: "text", widget: "text", required: false}
                  - {label: "Image", name: "image", widget: "image", required: false}
                  - {label: "Image Alt Text", name: "image_alt", widget: "string", required: false}
                  - {label: "Button Text", name: "button_text", widget: "string", required: false}
