backend:
  name: github
  repo: benvorgroup/benvordigital
  branch: main
  base_url: https://benvor-cms-auth.benvorgroup.workers.dev/
  auth_endpoint: auth
media_folder: assets/images/uploads
public_folder: /assets/images/uploads
collections:
- name: builder_pages
  label: Page Builder
  label_singular: Page
  folder: content/pages
  create: true
  delete: true
  extension: json
  format: json
  slug: '{{fields.slug}}'
  identifier_field: title
  fields:
  - label: Page Name
    name: title
    widget: string
  - label: Slug
    name: slug
    widget: string
  - label: Navigation Label
    name: navigation_label
    widget: string
    required: false
  - label: Published
    name: published
    widget: boolean
    default: true
  - label: Page Mode
    name: mode
    widget: select
    options:
    - label: Default Existing Theme
      value: default
    - label: Builder Mode
      value: builder
    default: default
    hint: Default keeps your original HTML. Builder hides it and uses the sections below. Empty builder sections = blank page.
  - label: Show Header
    name: header_visible
    widget: boolean
    default: true
  - label: Show Footer
    name: footer_visible
    widget: boolean
    default: true
  - label: Theme
    name: theme
    widget: relation
    collection: themes
    search_fields:
    - name
    - slug
    value_field: '{{slug}}'
    display_fields:
    - name
    required: false
    hint: Leave as inherit to use the global theme.
  - label: Page Background
    name: page_background
    widget: color
    required: false
  - label: SEO
    name: seo
    widget: object
    fields:
    - label: SEO Title
      name: title
      widget: string
      required: false
    - label: Meta Description
      name: description
      widget: text
      required: false
    - label: Keywords
      name: keywords
      widget: string
      required: false
    - label: Canonical URL
      name: canonical_url
      widget: string
      required: false
    - label: Open Graph Title
      name: og_title
      widget: string
      required: false
    - label: Open Graph Description
      name: og_description
      widget: text
      required: false
    - label: Open Graph Image
      name: og_image
      widget: image
      required: false
    - label: Open Graph External URL
      name: og_image_external
      widget: string
      required: false
    - label: Allow Indexing
      name: robots_index
      widget: boolean
      default: true
    - label: Allow Following
      name: robots_follow
      widget: boolean
      default: true
  - label: Builder Sections
    name: sections
    widget: list
    collapsed: true
    summary: '{{fields.type}} — {{fields.heading}}'
    types:
    - label: Hero
      name: hero
      widget: object
      fields:
      - label: Visible
        name: visible
        widget: boolean
        default: true
      - label: Width
        name: width
        widget: select
        options:
        - narrow
        - wide
        - full
        default: wide
      - label: Alignment
        name: alignment
        widget: select
        options:
        - left
        - center
        - right
        default: left
      - label: Spacing
        name: spacing
        widget: select
        options:
        - compact
        - normal
        - spacious
        default: normal
      - label: Background Color
        name: background_color
        widget: color
        required: false
      - label: Text Color
        name: text_color
        widget: color
        required: false
      - label: Show on Mobile
        name: mobile_visible
        widget: boolean
        default: true
      - label: Show on Desktop
        name: desktop_visible
        widget: boolean
        default: true
      - label: Animation
        name: animation
        widget: select
        options:
        - none
        - fade
        - fade-up
        - slide-left
        - slide-right
        - scale
        default: none
      - label: Safe Style Classes
        name: classes
